spring.application.name=smart-wardrobe

# ── Supabase PostgreSQL Database (loaded from .env or environment) ──
spring.datasource.url=${SUPABASE_DB_URL}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${SUPABASE_DB_USER:postgres}
spring.datasource.password=${SUPABASE_DB_PASSWORD:}

# ── JPA / Hibernate for PostgreSQL ──
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# ── Supabase Storage (Image Uploads) ──
supabase.url=${SUPABASE_URL:https://spitnxgxefrsxzbqvdbd.supabase.co}
supabase.service-role-key=${SUPABASE_SERVICE_ROLE_KEY:}
supabase.storage.bucket=${SUPABASE_STORAGE_BUCKET:wardrobe-images}

# ── AI clothing recognition (Add to Wardrobe) — backend only, never in frontend JavaScript ──
# Detects category, primary colour and pattern only. Leave GEMINI_API_KEY empty to disable
# (the modal then asks the user to fill everything in manually).
gemini.api-key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-flash-latest}
# Values the model is less sure about than this are left unselected in the form.
vision.min-confidence=${VISION_MIN_CONFIDENCE:0.6}

# ── Garment segmentation (Beautify) — SAM 3 via Roboflow, backend only ──
# Free tier: https://app.roboflow.com (Settings > API Keys). Leave empty to use the browser's
# on-device model instead.
roboflow.api-key=${ROBOFLOW_API_KEY:}
roboflow.sam3.min-confidence=${ROBOFLOW_SAM3_MIN_CONFIDENCE:0.5}

# ── Multipart upload size limits ──
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

